<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Confirmation de mission - SOS Auto Tahiti</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --fb-blue: #1877F2;
      --fb-bg: #F7F4EE;
      --fb-text: #241E1A;
      --fb-text-secondary: #7C7267;
      --fb-border: #E8E1D6;
      --fb-green: #42B72A;
      --alerte: #E8590C;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--fb-bg); margin: 0; color: var(--fb-text);
      padding-top: env(safe-area-inset-top, 0px);
    }
    .topbar {
      background: linear-gradient(135deg, var(--fb-blue) 0%, #4A9AF5 100%);
      color: #fff; padding: 18px 16px;
      display: flex; align-items: center; gap: 12px;
      box-shadow: 0 3px 12px rgba(24,119,242,0.25);
      border-radius: 0 0 22px 22px;
    }
    .topbar .logo {
      width: 44px; height: 44px; border-radius: 50%; background: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0; box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      overflow: hidden;
    }
    .topbar .logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .topbar h1 { font-family: 'Quicksand', 'Nunito', sans-serif; font-size: 19px; font-weight: 700; margin: 0; }
    .topbar .sous-titre { font-size: 12.5px; opacity: 0.95; margin: 3px 0 0; font-weight: 600; color: #fff; }
    .conteneur { max-width: 560px; margin: 0 auto; padding: 16px 14px; }
    .carte {
      background: #fff; border-radius: 18px; padding: 40px 24px; margin-top: 14px;
      box-shadow: 0 2px 10px rgba(36,30,26,0.06);
      border: 1px solid var(--fb-border);
      text-align: center;
    }
    .icone {
      width: 72px; height: 72px; border-radius: 50%; background: var(--fb-green);
      color: #fff; font-size: 38px; display: flex; align-items: center; justify-content: center;
      margin: 0 auto 18px; box-shadow: 0 4px 14px rgba(66,183,42,0.35);
    }
    .icone.alerte { background: var(--alerte); box-shadow: 0 4px 14px rgba(232,89,12,0.35); }
    .icone.attente { background: #D8D2C6; box-shadow: none; }
    h2 { font-family: 'Quicksand', sans-serif; font-size: 21px; margin: 0 0 10px; font-weight: 700; }
    p { color: var(--fb-text-secondary); font-size: 15px; line-height: 1.5; margin: 0; }
    .btn { width: 100%; padding: 15px; border: none; border-radius: 14px; background: var(--fb-blue); color: #fff;
      font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 800; cursor: pointer; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="logo"><img src="logo.png" alt="SOS Auto Tahiti"></div>
    <div>
      <h1>SOS Auto Tahiti</h1>
      <p class="sous-titre">Espace mécanicien</p>
    </div>
  </div>

  <div class="conteneur">
    <div class="carte">
      <div class="icone attente" id="icone">…</div>
      <h2 id="titre">Traitement en cours…</h2>
      <p id="message">Un instant, on enregistre votre réponse.</p>
      <div id="zone-bouton" style="display:none; margin-top:24px;">
        <button id="btn-confirmer" class="btn">Confirmer</button>
        <p style="margin-top:12px; font-size:13px;">Mauvais lien ? Fermez simplement cette page.</p>
      </div>
    </div>
  </div>

  <script>
    // === URL de l'API Apps Script (identique a celle du formulaire) ===
    const APP_URL = 'https://script.google.com/macros/s/AKfycbwmpyrWUsOv0ABb9Wg_V2iS5m3vBNpytw7qnh58ebluL-3ft3NYxfDl8AifRXYETrb3/exec';

    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const action = params.get('action');

    function afficher(titre, message, etat) {
      document.getElementById('titre').textContent = titre;
      document.getElementById('message').textContent = message;
      const icone = document.getElementById('icone');
      icone.className = 'icone' + (etat === 'alerte' ? ' alerte' : '');
      icone.textContent = etat === 'alerte' ? '!' : '✓';
    }

    function envoyer() {
      document.getElementById('zone-bouton').style.display = 'none';
      document.getElementById('icone').className = 'icone attente';
      document.getElementById('icone').textContent = '…';
      document.getElementById('titre').textContent = 'Traitement en cours…';
      document.getElementById('message').textContent = 'Un instant, on enregistre votre réponse.';
      fetch(APP_URL + '?action=confirmerMission&token=' + encodeURIComponent(token) + '&type=' + encodeURIComponent(action))
        .then(r => r.json())
        .then(function(res) {
          const titre = res.titre || 'Terminé';
          const echec = /invalide|inconnue|erreur/i.test(titre);
          afficher(titre, res.message || '', echec ? 'alerte' : 'ok');
        })
        .catch(function(err) {
          afficher('Erreur de connexion', 'Impossible de joindre le serveur (' + err.message + '). Merci de réessayer dans un instant.', 'alerte');
        });
    }

    // Fin de mission : on demande une confirmation avant d'agir (la facture part au client)
    const FIN_MISSION = {
      termine: ['Intervention effectuée et payée\u00a0?', 'Conforme au devis et réglée par carte bancaire. La facture sera envoyée automatiquement au client.', '✅ Oui, envoyer la facture'],
      modifie: ['Intervention différente du devis\u00a0?', 'Travaux en plus ou en moins : le gérant établira la facture lui-même.', 'Confirmer'],
      non_effectue: ['Intervention non effectuée\u00a0?', 'Client absent, annulation ou travail impossible : le gérant sera prévenu.', 'Confirmer']
    };

    if (!token || !action) {
      afficher('Lien incomplet', 'Ce lien est invalide. Merci de recliquer depuis le mail de mission.', 'alerte');
    } else if (FIN_MISSION[action]) {
      const t = FIN_MISSION[action];
      document.getElementById('icone').className = 'icone' + (action === 'termine' ? '' : ' alerte');
      document.getElementById('icone').textContent = action === 'termine' ? '✓' : '!';
      document.getElementById('titre').textContent = t[0];
      document.getElementById('message').textContent = t[1];
      document.getElementById('btn-confirmer').textContent = t[2];
      document.getElementById('zone-bouton').style.display = 'block';
      document.getElementById('btn-confirmer').addEventListener('click', envoyer);
    } else {
      envoyer();
    }
  </script>
</body>
</html>
